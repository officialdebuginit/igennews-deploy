# Default brand configuration — the platform ships as "iGEN News".
#
# This file is the DEFAULT. It is loaded at startup (crates/web/src/brand.rs) and
# stands in until an admin overrides branding at runtime (workspace_branding, set
# via /admin/branding). Only an admin may change branding; every user may change
# their own THEME (light/dark/font) independently — themes never touch the brand.
#
# Keys are a flat map of `key: "value"`. Colours are hex; the default theme is pure
# premium black & white, so the brand accent is ink-black.

name: "iGEN News"
subtitle: "Editorial Newsroom"
tagline: "Intelligence-grade journalism — pitch to correction, end to end."
description: "iGEN News — a premium editorial newsroom operating system."

# Logo: a monogram mark shown in the masthead + boot screen, and full logo/favicon
# SVGs under crates/web/assets/brand/.
mark: "iG"
logo: "/assets/brand/logo.svg"
favicon: "/assets/brand/favicon.svg"

# Brand colours (admin-overridable). Monochrome by default to match the B&W theme.
accent: "#0a0a0a"
ink: "#0a0a0a"
